name: Cross Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep main releases ordered; a new PR update can cancel its older build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test - ${{ matrix.backend }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [ureq-support, nyquest-support]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.backend }}
      - name: Install native HTTP backend dependencies
        if: matrix.backend == 'nyquest-support'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev pkg-config
      - name: Test agent
        run: cargo test --features "${{ matrix.backend }}" --locked
      - name: Check management scripts
        if: matrix.backend == 'ureq-support'
        run: |
          bash -n komari-manager.sh install.sh tests/manager.sh
          bash tests/manager.sh

  linux-release:
    name: Build - ${{ matrix.platform.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-unknown-linux-gnu
            binary_name: komari-monitor-rs-linux-x86_64-gnu
          - target: aarch64-unknown-linux-gnu
            binary_name: komari-monitor-rs-linux-aarch64-gnu
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: minimal-${{ matrix.platform.target }}
      - name: Install compression tool
        run: sudo apt-get update && sudo apt-get install -y upx
      - name: Install Cross
        run: |
          if ! command -v cross >/dev/null 2>&1; then
            cargo install cross --git https://github.com/cross-rs/cross --locked
          fi
      - name: Build binary
        run: cross build --target "${{ matrix.platform.target }}" --features ureq-support --profile minimal --locked
      - name: Prepare binary
        env:
          TARGET: ${{ matrix.platform.target }}
          BINARY_NAME: ${{ matrix.platform.binary_name }}
        run: |
          upx --best "target/$TARGET/minimal/komari-monitor-rs"
          mkdir -p dist
          cp "target/$TARGET/minimal/komari-monitor-rs" "dist/$BINARY_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform.target }}
          path: dist/*
          if-no-files-found: error

  native-release:
    name: Build - ${{ matrix.platform.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable: komari-monitor-rs.exe
            binary_name: komari-monitor-rs.exe
          - runner: macos-latest
            target: aarch64-apple-darwin
            executable: komari-monitor-rs
            binary_name: komari-monitor-rs-macos-arm64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: minimal-${{ matrix.platform.target }}
      - name: Build binary
        run: cargo build --target "${{ matrix.platform.target }}" --profile minimal --features ureq-support --locked
      - name: Prepare binary
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
          EXECUTABLE: ${{ matrix.platform.executable }}
          BINARY_NAME: ${{ matrix.platform.binary_name }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/minimal/$EXECUTABLE" "dist/$BINARY_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish latest
    needs: [linux-release, native-release]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Prepare release metadata
        id: metadata
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cd dist
          sha256sum komari-monitor-rs* > SHA256SUMS
      - name: Point rolling latest tag at this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/latest -f sha="$GITHUB_SHA"
          fi
      - name: Publish all platforms together
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Komari Monitor RS ${{ steps.metadata.outputs.version }}
          body: |
            Version: ${{ steps.metadata.outputs.version }}
            Commit: ${{ github.sha }}

            Rolling latest build. All platform builds and tests passed before publication.
            SHA256SUMS contains checksums for the downloadable binaries.
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
          prerelease: false
